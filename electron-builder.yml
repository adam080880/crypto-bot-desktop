appId: dev.local.smc-trading-assistant
productName: SMC Trading Assistant
executableName: smc-trading-assistant
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  # Claude Code is NOT bundled (~300 MB): the app uses the user's installed `claude`
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/node_modules/better-sqlite3/{build,deps,src}/**"
  # Build outputs (release/, release-next/ …) must never end up inside app.asar
  - "!release*{,/**}"
extraResources:
  - from: drizzle
    to: drizzle
  - from: docs
    to: docs
asarUnpack:
  - node_modules/better-sqlite3/**
# better-sqlite3 v13 is N-API with bundled prebuilds for every platform → no native rebuild
npmRebuild: false
mac:
  files:
    # Platform `files` with only "!" patterns makes electron-builder add "**/*" (whole repo). Keep the includes.
    - out/**
    - package.json
    - "!**/node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl}-*"
  category: public.app-category.finance
  target: dmg
win:
  files:
    # Platform `files` with only "!" patterns makes electron-builder add "**/*" (whole repo). Keep the includes.
    - out/**
    - package.json
    - "!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*"
    - "!**/node_modules/better-sqlite3/prebuilds/win32-arm64.node"
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
